name: Build and test package

on:
  pull_request:
  push:
    branches:
      - "**"
  workflow_dispatch:
  workflow_call:
    inputs:
      package_version:
        description: NuGet package version
        required: false
        type: string
        default: 0.1.0

env:
  PACKAGE_VERSION: ${{ inputs.package_version || '0.1.0' }}
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-native:
    name: Build native (${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build native runtime
        shell: pwsh
        run: ./scripts/build-native.ps1 -RuntimeId "${{ matrix.rid }}"

      - name: Upload native runtime
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/native
          if-no-files-found: error

  pack:
    name: Aggregate and pack NuGet
    needs: build-native
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download native runtimes
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts/native
          merge-multiple: true

      - name: Verify runtime set
        shell: pwsh
        run: |
          $expected = @("linux-x64", "linux-arm64")
          foreach ($rid in $expected) {
            $path = "artifacts/native/$rid/libnserial.so.1"
            if (!(Test-Path -LiteralPath $path)) { throw "Missing native runtime: $path" }
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack NuGet
        run: >-
          dotnet pack
          src/Darp.DLL.SerialPortStream.Native/Darp.DLL.SerialPortStream.Native.csproj
          -c Release
          -o artifacts/packages
          -p:Version=${{ env.PACKAGE_VERSION }}

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg
          if-no-files-found: error

  test-package:
    name: Test package (${{ matrix.rid }})
    needs: pack
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            runner: ubuntu-24.04
          - rid: linux-arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: packages
          path: artifacts/packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore tests from local package feed
        shell: pwsh
        run: |
          $feed = (Resolve-Path "artifacts/packages").Path
          dotnet restore tests/Darp.DLL.SerialPortStream.Native.Tests/Darp.DLL.SerialPortStream.Native.Tests.csproj `
            --runtime "${{ matrix.rid }}" `
            --source "https://api.nuget.org/v3/index.json" `
            --source "$feed" `
            -p:NativePackageVersion="${{ env.PACKAGE_VERSION }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run linked upstream tests
        shell: pwsh
        run: |
          dotnet test tests/Darp.DLL.SerialPortStream.Native.Tests/Darp.DLL.SerialPortStream.Native.Tests.csproj `
            -c Release `
            --no-restore `
            --runtime "${{ matrix.rid }}" `
            -p:NativePackageVersion="${{ env.PACKAGE_VERSION }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
